<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketHub · buy & sell tickets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f7fe 0%, #e9edf5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .app-wrapper {
            max-width: 1300px;
            width: 100%;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -8px rgba(0, 20, 30, 0.25), 0 0 0 1px rgba(255,255,255,0.7) inset;
            padding: 2rem 2rem 2.5rem;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b1a2e;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 0.5rem;
        }
        h1 span {
            background: #1d4ed8;
            color: white;
            font-size: 1.3rem;
            padding: 0.15rem 0.75rem;
            border-radius: 40px;
            letter-spacing: normal;
        }
        .subhead {
            color: #2c3e5c;
            font-size: 1rem;
            margin-bottom: 2rem;
            border-left: 4px solid #2563eb;
            padding-left: 1rem;
            font-weight: 400;
            background: rgba(37, 99, 235, 0.05);
            border-radius: 0 12px 12px 0;
            padding: 0.75rem 1rem;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.9fr;
            gap: 2rem;
        }
        /* ---------- SEAT MAP ---------- */
        .seating-section {
            background: #ffffffd9;
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.5rem 1.8rem 1.8rem;
            box-shadow: 0 8px 20px -6px rgba(0,0,0,0.08), 0 0 0 1px #ffffff80 inset;
        }
        .stage {
            background: #0b1a2e;
            color: white;
            text-align: center;
            padding: 0.8rem 0;
            border-radius: 3rem;
            font-weight: 500;
            letter-spacing: 2px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 12px -6px #0b1a2e50;
        }
        .seat-map {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
        }
        .row-label {
            width: 2rem;
            font-weight: 600;
            color: #1e293b;
            font-size: 0.95rem;
            opacity: 0.7;
        }
        .seat {
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 12px 12px 6px 6px;
            background: #e2e8f0;
            border: 1.5px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 3px #00000008;
            user-select: none;
        }
        .seat.available:hover {
            background: #bfdbfe;
            border-color: #3b82f6;
            transform: scale(1.02);
        }
        .seat.selected {
            background: #2563eb;
            border-color: #1e40af;
            color: white;
            box-shadow: 0 6px 10px -4px #1e40af80;
        }
        .seat.sold {
            background: #9ca3af;
            border-color: #6b7280;
            color: #f1f5f9;
            cursor: not-allowed;
            opacity: 0.6;
            text-decoration: line-through;
            font-size: 0.7rem;
            pointer-events: none;
        }
        .legend {
            display: flex;
            gap: 1.8rem;
            justify-content: center;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            color: #1e293b;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }
        .legend-box {
            width: 1.1rem;
            height: 1.1rem;
            border-radius: 4px;
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
        }
        .legend-box.selected { background: #2563eb; border-color: #1e40af; }
        .legend-box.sold { background: #9ca3af; border-color: #6b7280; opacity: 0.7; }
        /* ---------- CHECKOUT PANEL ---------- */
        .checkout-section {
            background: #ffffffd9;
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            padding: 1.8rem 1.6rem;
            box-shadow: 0 8px 20px -6px rgba(0,0,0,0.08), 0 0 0 1px #ffffff80 inset;
            display: flex;
            flex-direction: column;
        }
        .checkout-section h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0b1a2e;
            margin-bottom: 1.5rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .selected-info {
            background: #f1f5f9;
            border-radius: 1.2rem;
            padding: 1.2rem 1.2rem;
            margin-bottom: 1.8rem;
            border: 1px solid #e2e8f0;
        }
        .selected-info p {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .selected-info .total {
            font-weight: 700;
            font-size: 1.2rem;
            border-top: 1px dashed #cbd5e1;
            padding-top: 0.75rem;
            margin-top: 0.75rem;
            color: #0b1a2e;
        }
        .ticket-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            min-height: 2rem;
            margin: 0.5rem 0 0.2rem;
        }
        .ticket-badge {
            background: #2563eb10;
            border: 1px solid #2563eb30;
            color: #1e40af;
            padding: 0.25rem 0.8rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .payment-block {
            margin-bottom: 1.6rem;
        }
        .payment-block label {
            font-weight: 500;
            color: #0b1a2e;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 0.4rem;
        }
        .email-input {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 1.2rem;
            border: 1.5px solid #e2e8f0;
            background: white;
            font-size: 0.95rem;
            transition: 0.15s;
            outline: none;
        }
        .email-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #2563eb20;
        }
        .file-upload-wrapper {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 1.2rem;
            padding: 1.2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
            margin-bottom: 0.8rem;
        }
        .file-upload-wrapper:hover {
            background: #f1f5f9;
            border-color: #2563eb;
        }
        .file-upload-wrapper input {
            display: none;
        }
        .file-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            color: #475569;
            font-size: 0.9rem;
        }
        .file-label svg {
            opacity: 0.7;
        }
        .preview-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #f1f5f9;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            word-break: break-all;
        }
        .preview-area img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 8px;
        }
        .btn-primary {
            background: #0b1a2e;
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 8px 16px -6px #0b1a2e60;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }
        .btn-primary:hover:not(:disabled) {
            background: #1e2a44;
            transform: translateY(-2px);
            box-shadow: 0 14px 20px -8px #0b1a2e80;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .message-box {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            padding: 0.9rem 1rem;
            border-radius: 1rem;
            background: #f1f5f9;
            color: #0b1a2e;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-left: 4px solid #2563eb;
        }
        .message-box.success {
            background: #dcfce7;
            border-left-color: #16a34a;
            color: #166534;
        }
        .message-box.warning {
            background: #fff3cd;
            border-left-color: #eab308;
            color: #854d0e;
        }
        .message-box.error {
            background: #fee2e2;
            border-left-color: #dc2626;
            color: #991b1b;
        }
        .hidden { display: none; }

        @media (max-width: 950px) {
            .main-grid { grid-template-columns: 1fr; }
            .app-wrapper { padding: 1.5rem; }
        }
        @media (max-width: 550px) {
            .seat { width: 2.1rem; height: 2.1rem; font-size: 0.65rem; }
            .row-label { width: 1.5rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <h1>TicketHub <span>secure</span></h1>
    <div class="subhead">Select your seats · pay & upload proof · get tickets via email</div>

    <div class="main-grid">
        <!-- SEATING CHART -->
        <div class="seating-section">
            <div class="stage">🎭 MAIN STAGE</div>
            <div class="seat-map" id="seatMap">
                <!-- dynamically built with JS -->
            </div>
            <div class="legend">
                <div class="legend-item"><div class="legend-box"></div> available</div>
                <div class="legend-item"><div class="legend-box selected"></div> selected</div>
                <div class="legend-item"><div class="legend-box sold"></div> sold</div>
            </div>
        </div>

        <!-- CHECKOUT / PAYMENT -->
        <div class="checkout-section">
            <h2>🎫 Your order</h2>
            <div class="selected-info" id="orderSummary">
                <p><span>Selected seats</span> <span id="seatCountDisplay">0</span></p>
                <div class="ticket-list" id="selectedSeatsList"></div>
                <p class="total"><span>Total</span> <span id="totalPrice">$0</span></p>
            </div>

            <!-- Email for ticket transfer -->
            <div class="payment-block">
                <label>📧 Email to receive tickets</label>
                <input type="email" id="emailInput" class="email-input" placeholder="your@email.com" value="customer@example.com">
            </div>

            <!-- Payment confirmation upload -->
            <div class="payment-block">
                <label>💳 Payment confirmation (screenshot / photo)</label>
                <div class="file-upload-wrapper" id="uploadWrapper">
                    <input type="file" id="paymentProof" accept="image/*">
                    <div class="file-label">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="10.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>Click to upload or drag & drop</span>
                        <span style="font-size:0.75rem; opacity:0.6;">PNG, JPG up to 10MB</span>
                    </div>
                </div>
                <div id="filePreview" class="preview-area hidden"></div>
            </div>

            <!-- Release ticket button -->
            <button class="btn-primary" id="releaseBtn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
                Release ticket & email
            </button>

            <!-- message area -->
            <div id="statusMessage" class="message-box hidden"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- SEAT CONFIGURATION ----------
        const ROWS = ['A', 'B', 'C', 'D'];
        const SEATS_PER_ROW = 8;    // seat numbers 1..8

        // initial sold seats (some already sold)
        const soldSeats = new Set(['A3', 'A4', 'B1', 'B6', 'C2', 'C7', 'D5', 'D8']);

        // price per seat
        const TICKET_PRICE = 85;

        // selected seats set
        let selectedSeats = new Set();

        // DOM elements
        const seatMapEl = document.getElementById('seatMap');
        const seatCountDisplay = document.getElementById('seatCountDisplay');
        const selectedSeatsList = document.getElementById('selectedSeatsList');
        const totalPriceEl = document.getElementById('totalPrice');
        const emailInput = document.getElementById('emailInput');
        const paymentProofInput = document.getElementById('paymentProof');
        const filePreview = document.getElementById('filePreview');
        const uploadWrapper = document.getElementById('uploadWrapper');
        const releaseBtn = document.getElementById('releaseBtn');
        const statusMessage = document.getElementById('statusMessage');

        // ---------- RENDER SEAT MAP ----------
        function renderSeatMap() {
            seatMapEl.innerHTML = '';
            ROWS.forEach(rowLetter => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                const label = document.createElement('div');
                label.className = 'row-label';
                label.textContent = rowLetter;
                rowDiv.appendChild(label);

                for (let num = 1; num <= SEATS_PER_ROW; num++) {
                    const seatId = `${rowLetter}${num}`;
                    const seatDiv = document.createElement('div');
                    seatDiv.className = 'seat';

                    // determine state
                    if (soldSeats.has(seatId)) {
                        seatDiv.classList.add('sold');
                        seatDiv.textContent = '✕';
                    } else {
                        seatDiv.classList.add('available');
                        seatDiv.textContent = `${rowLetter}${num}`;
                        if (selectedSeats.has(seatId)) {
                            seatDiv.classList.add('selected');
                        }
                    }

                    // click handler for available seats
                    seatDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (soldSeats.has(seatId)) return; // sold -> ignore
                        toggleSeat(seatId, seatDiv);
                    });

                    rowDiv.appendChild(seatDiv);
                }
                seatMapEl.appendChild(rowDiv);
            });
        }

        // ---------- TOGGLE SEAT SELECTION ----------
        function toggleSeat(seatId, seatElement) {
            if (selectedSeats.has(seatId)) {
                selectedSeats.delete(seatId);
                seatElement.classList.remove('selected');
            } else {
                selectedSeats.add(seatId);
                seatElement.classList.add('selected');
            }
            updateOrderSummary();
            validateForm();
        }

        // ---------- UPDATE ORDER SUMMARY ----------
        function updateOrderSummary() {
            const count = selectedSeats.size;
            seatCountDisplay.textContent = count;

            // rebuild ticket list
            selectedSeatsList.innerHTML = '';
            if (count === 0) {
                selectedSeatsList.innerHTML = '<span style="color:#64748b; font-size:0.85rem;">No seats selected</span>';
            } else {
                const sorted = Array.from(selectedSeats).sort();
                sorted.forEach(seat => {
                    const badge = document.createElement('span');
                    badge.className = 'ticket-badge';
                    badge.textContent = seat;
                    selectedSeatsList.appendChild(badge);
                });
            }

            // total price
            const total = count * TICKET_PRICE;
            totalPriceEl.textContent = `$${total}`;
        }

        // ---------- FILE PREVIEW ----------
        function handleFilePreview(file) {
            if (!file) {
                filePreview.classList.add('hidden');
                filePreview.innerHTML = '';
                return;
            }
            filePreview.classList.remove('hidden');
            filePreview.innerHTML = '';

            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                img.onload = () => URL.revokeObjectURL(img.src);
                filePreview.appendChild(img);
                const nameSpan = document.createElement('span');
                nameSpan.textContent = file.name.length > 30 ? file.name.substring(0, 27) + '...' : file.name;
                filePreview.appendChild(nameSpan);
            } else {
                filePreview.textContent = `📎 ${file.name}`;
            }
        }

        // ---------- VALIDATE FORM (enable button) ----------
        function validateForm() {
            const hasSeats = selectedSeats.size > 0;
            const hasEmail = emailInput.value.trim() !== '' && emailInput.value.includes('@');
            const hasFile = paymentProofInput.files.length > 0;
            releaseBtn.disabled = !(hasSeats && hasEmail && hasFile);
        }

        // ---------- SHOW STATUS MESSAGE ----------
        function showMessage(text, type = 'info') {
            statusMessage.classList.remove('hidden', 'success', 'warning', 'error');
            statusMessage.classList.add(type);
            statusMessage.innerHTML = text;
        }

        // ---------- RELEASE TICKETS (SIMULATE EMAIL + PAYMENT CONFIRMATION) ----------
        function releaseTickets() {
            // final validation
            if (selectedSeats.size === 0) {
                showMessage('❌ Please select at least one seat.', 'error');
                return;
